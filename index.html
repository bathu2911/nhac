<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Nhạc Lấy URL Vĩnh Viễn</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 500px;
        }
        h2 {
            margin-top: 0;
            color: #333;
            text-align: center;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #555;
            font-size: 14px;
        }
        input[type="file"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #0056b3;
        }
        button:disabled {
            background-color: #aaa;
            cursor: not-allowed;
        }
        .result-box {
            margin-top: 20px;
            padding: 15px;
            background: #e9ecef;
            border-radius: 6px;
            display: none;
        }
        .url-output {
            word-break: break-all;
            background: #fff;
            padding: 8px;
            border: 1px dashed #007bff;
            border-radius: 4px;
            font-size: 13px;
            color: #333;
            margin-bottom: 10px;
        }
        audio {
            width: 100%;
            margin-top: 10px;
        }
        .status {
            text-align: center;
            font-weight: bold;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>🎵 Upload Nhạc Cloudinary</h2>

    <!-- Chọn File -->
    <div class="form-group">
        <label for="audioFile">Chọn file nhạc (.mp3, .wav, .m4a...):</label>
        <input type="file" id="audioFile" accept="audio/*">
    </div>

    <button id="uploadBtn" onclick="uploadAudio()">Tải Lên & Lấy URL</button>

    <div id="status" class="status"></div>

    <!-- Kết quả -->
    <div id="resultBox" class="result-box">
        <label>URL Vĩnh Viễn:</label>
        <div id="urlOutput" class="url-output"></div>
        <button onclick="copyURL()" style="padding: 6px; font-size: 13px; margin-bottom: 10px; background: #28a745;">📋 Sao chép URL</button>
        
        <label>Nghe thử:</label>
        <audio id="audioPlayer" controls></audio>
    </div>
</div>

<script>
    // ⚙️ ĐIỀN THÔNG TIN CLOUDINARY CỦA BẠN VÀO ĐÂY
    const CLOUD_NAME = "TEN_CLOUD_CUA_BAN"; 
    const UPLOAD_PRESET = "TEN_PRESET_CUA_BAN";

    async function uploadAudio() {
        const fileInput = document.getElementById('audioFile');
        const file = fileInput.files[0];

        const statusDiv = document.getElementById('status');
        const resultBox = document.getElementById('resultBox');
        const uploadBtn = document.getElementById('uploadBtn');

        if (!file) {
            alert('Vui lòng chọn một file nhạc!');
            return;
        }

        // Bắt đầu upload
        uploadBtn.disabled = true;
        statusDiv.style.color = '#007bff';
        statusDiv.innerText = '⏳ Đang tải nhạc lên đám mây...';
        resultBox.style.display = 'none';

        // Tạo Form Data để gửi API
        const formData = new FormData();
        formData.append('file', file);
        formData.append('upload_preset', UPLOAD_PRESET);

        try {
            // Gọi trực tiếp API Cloudinary
            const response = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/video/upload`, {
                method: 'POST',
                body: formData
            });

            const data = await response.json();

            if (response.ok) {
                statusDiv.style.color = '#28a745';
                statusDiv.innerText = '✅ Upload thành công!';

                // Hiển thị kết quả
                document.getElementById('urlOutput').innerText = data.secure_url;
                document.getElementById('audioPlayer').src = data.secure_url;
                resultBox.style.display = 'block';
            } else {
                throw new Error(data.error ? data.error.message : 'Upload thất bại');
            }
        } catch (error) {
            statusDiv.style.color = '#dc3545';
            statusDiv.innerText = '❌ Lỗi: ' + error.message;
        } finally {
            uploadBtn.disabled = false;
        }
    }

    function copyURL() {
        const urlText = document.getElementById('urlOutput').innerText;
        navigator.clipboard.writeText(urlText);
        alert('Đã sao chép URL vào bộ nhớ tạm!');
    }
</script>

</body>
</html>
