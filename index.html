<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Nhạc Lấy URL Vĩnh Viễn</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            margin: 0;
            padding: 30px 15px;
        }
        .container {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 550px;
        }
        h2 {
            margin-top: 0;
            color: #333;
            text-align: center;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #555;
            font-size: 14px;
        }
        input[type="file"], input[type="text"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #0056b3;
        }
        button:disabled {
            background-color: #aaa;
            cursor: not-allowed;
        }
        .result-box {
            margin-top: 20px;
            padding: 15px;
            background: #e9ecef;
            border-radius: 6px;
            display: none;
        }
        .url-output {
            word-break: break-all;
            background: #fff;
            padding: 8px;
            border: 1px dashed #007bff;
            border-radius: 4px;
            font-size: 13px;
            color: #333;
            margin-bottom: 10px;
        }
        audio {
            width: 100%;
            margin-top: 10px;
        }
        .status {
            text-align: center;
            font-weight: bold;
            margin-top: 10px;
        }

        /* CSS cho phần Lịch sử */
        .history-section {
            margin-top: 30px;
            border-top: 2px solid #eee;
            padding-top: 20px;
        }
        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .history-header h3 {
            margin: 0;
            color: #333;
            font-size: 18px;
        }
        .clear-btn {
            width: auto;
            padding: 5px 10px;
            font-size: 12px;
            background-color: #dc3545;
        }
        .clear-btn:hover {
            background-color: #c82333;
        }
        .history-list {
            list-style: none;
            padding: 0;
            margin: 0;
            max-height: 350px;
            overflow-y: auto;
        }
        .history-item {
            background: #f8f9fa;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 10px;
        }
        .song-title {
            font-weight: bold;
            color: #222;
            font-size: 15px;
            margin-bottom: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .song-date {
            font-size: 11px;
            color: #888;
            font-weight: normal;
        }
        .song-url {
            font-size: 12px;
            color: #0066cc;
            word-break: break-all;
            background: #fff;
            padding: 6px;
            border-radius: 4px;
            border: 1px solid #ddd;
            margin-bottom: 8px;
        }
        .history-actions {
            display: flex;
            gap: 8px;
        }
        .history-actions button {
            padding: 6px 10px;
            font-size: 12px;
            flex: 1;
        }
        .btn-copy-item { background-color: #28a745; }
        .btn-copy-item:hover { background-color: #218838; }
        .btn-play-item { background-color: #17a2b8; }
        .btn-play-item:hover { background-color: #138496; }
        .btn-del-item { background-color: #6c757d; flex: 0.4 !important; }
        .btn-del-item:hover { background-color: #5a6268; }
        .empty-history {
            text-align: center;
            color: #888;
            font-size: 14px;
            font-style: italic;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>🎵 Upload Nhạc Cloudinary</h2>

    <!-- Chọn File -->
    <div class="form-group">
        <label for="audioFile">Chọn file nhạc (.mp3, .wav, .m4a...):</label>
        <input type="file" id="audioFile" accept="audio/*" onchange="autoFillName()">
    </div>

    <!-- Tên bài hát (Tùy chỉnh) -->
    <div class="form-group">
        <label for="songName">Tên bài hát (tự lấy theo tên file hoặc nhập mới):</label>
        <input type="text" id="songName" placeholder="Nhập tên bài hát...">
    </div>

    <button id="uploadBtn" onclick="uploadAudio()">Tải Lên & Lấy URL</button>

    <div id="status" class="status"></div>

    <!-- Kết quả vừa tải -->
    <div id="resultBox" class="result-box">
        <label>URL Vĩnh Viễn:</label>
        <div id="urlOutput" class="url-output"></div>
        <button onclick="copyText(document.getElementById('urlOutput').innerText)" style="padding: 8px; font-size: 13px; margin-bottom: 10px; background: #28a745;">📋 Sao chép URL</button>
        
        <label>Nghe thử:</label>
        <audio id="audioPlayer" controls></audio>
    </div>

    <!-- Phần Lịch sử -->
    <div class="history-section">
        <div class="history-header">
            <h3>📜 Lịch sử tải lên</h3>
            <button class="clear-btn" onclick="clearHistory()">🗑️ Xóa tất cả</button>
        </div>
        <ul id="historyList" class="history-list"></ul>
    </div>
</div>

<script>
    // ⚙️ ĐIỀN THÔNG TIN CLOUDINARY CỦA BẠN VÀO ĐÂY
    const CLOUD_NAME = "qsko88gu"; 
    const UPLOAD_PRESET = "nhaccuatoi";
    const STORAGE_KEY = "cloudinary_audio_history";

    // Tải lịch sử ngay khi mở trang
    document.addEventListener("DOMContentLoaded", renderHistory);

    // Tự động điền tên bài hát từ tên file được chọn
    function autoFillName() {
        const fileInput = document.getElementById('audioFile');
        const songNameInput = document.getElementById('songName');
        if (fileInput.files.length > 0) {
            // Bỏ phần đuôi mở rộng (.mp3, .wav...)
            const rawName = fileInput.files[0].name.replace(/\.[^/.]+$/, "");
            songNameInput.value = rawName;
        }
    }

    async function uploadAudio() {
        const fileInput = document.getElementById('audioFile');
        const songNameInput = document.getElementById('songName');
        const file = fileInput.files[0];

        const statusDiv = document.getElementById('status');
        const resultBox = document.getElementById('resultBox');
        const uploadBtn = document.getElementById('uploadBtn');

        if (!file) {
            alert('Vui lòng chọn một file nhạc!');
            return;
        }

        const songTitle = songNameInput.value.trim() || file.name;

        // Bắt đầu upload
        uploadBtn.disabled = true;
        statusDiv.style.color = '#007bff';
        statusDiv.innerText = '⏳ Đang tải nhạc lên đám mây...';
        resultBox.style.display = 'none';

        const formData = new FormData();
        formData.append('file', file);
        formData.append('upload_preset', UPLOAD_PRESET);

        try {
            const response = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/video/upload`, {
                method: 'POST',
                body: formData
            });

            const data = await response.json();

            if (response.ok) {
                statusDiv.style.color = '#28a745';
                statusDiv.innerText = '✅ Upload thành công!';

                // Hiển thị kết quả
                document.getElementById('urlOutput').innerText = data.secure_url;
                document.getElementById('audioPlayer').src = data.secure_url;
                resultBox.style.display = 'block';

                // Lưu vào lịch sử
                saveToHistory(songTitle, data.secure_url);

                // Reset input
                fileInput.value = '';
                songNameInput.value = '';
            } else {
                throw new Error(data.error ? data.error.message : 'Upload thất bại');
            }
        } catch (error) {
            statusDiv.style.color = '#dc3545';
            statusDiv.innerText = '❌ Lỗi: ' + error.message;
        } finally {
            uploadBtn.disabled = false;
        }
    }

    // Lưu bài hát vào localStorage
    function saveToHistory(title, url) {
        const history = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
        const newItem = {
            id: Date.now(),
            title: title,
            url: url,
            date: new Date().toLocaleString('vi-VN', { hour: '2-digit', minute: '2-digit', day: '2-digit', month: '2-digit', year: 'numeric' })
        };
        history.unshift(newItem); // Thêm lên đầu danh sách
        localStorage.setItem(STORAGE_KEY, JSON.stringify(history));
        renderHistory();
    }

    // Hiển thị danh sách lịch sử ra màn hình
    function renderHistory() {
        const historyList = document.getElementById('historyList');
        const history = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];

        if (history.length === 0) {
            historyList.innerHTML = '<li class="empty-history">Chưa có bài hát nào được tải lên.</li>';
            return;
        }

        historyList.innerHTML = history.map(item => `
            <li class="history-item">
                <div class="song-title">
                    <span>🎵 ${escapeHTML(item.title)}</span>
                    <span class="song-date">${item.date}</span>
                </div>
                <div class="song-url">${item.url}</div>
                <div class="history-actions">
                    <button class="btn-copy-item" onclick="copyText('${item.url}')">📋 Copy URL</button>
                    <button class="btn-play-item" onclick="playFromHistory('${item.url}')">▶️ Nghe thử</button>
                    <button class="btn-del-item" onclick="deleteHistoryItem(${item.id})">Xóa</button>
                </div>
            </li>
        `).join('');
    }

    // Nghe thử bài hát từ lịch sử
    function playFromHistory(url) {
        const resultBox = document.getElementById('resultBox');
        const audioPlayer = document.getElementById('audioPlayer');
        document.getElementById('urlOutput').innerText = url;
        audioPlayer.src = url;
        resultBox.style.display = 'block';
        audioPlayer.play();
        resultBox.scrollIntoView({ behavior: 'smooth' });
    }

    // Xóa 1 mục trong lịch sử
    function deleteHistoryItem(id) {
        let history = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
        history = history.filter(item => item.id !== id);
        localStorage.setItem(STORAGE_KEY, JSON.stringify(history));
        renderHistory();
    }

    // Xóa toàn bộ lịch sử
    function clearHistory() {
        if (confirm('Bạn có chắc muốn xóa toàn bộ lịch sử tải lên?')) {
            localStorage.removeItem(STORAGE_KEY);
            renderHistory();
        }
    }

    // Hàm copy chung
    function copyText(text) {
        navigator.clipboard.writeText(text);
        alert('Đã sao chép URL vào bộ nhớ tạm!');
    }

    // Chống lỗi ký tự đặc biệt trong tên bài hát
    function escapeHTML(str) {
        return str.replace(/[&<>'"]/g, tag => ({
            '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
        }[tag]));
    }
</script>

</body>
</html>
